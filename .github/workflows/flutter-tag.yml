name: Flutter Tag Build

# Palta PC: solo a mano (Actions → Run workflow, o `gh workflow run flutter-tag.yml --ref <tag>`).
# Con el disparo por tag, subir el tag y lanzarlo a mano corría dos builds y GitHub apagó Actions en el fork.
on:
  workflow_dispatch:

jobs:
  run-flutter-tag-build:
    uses: ./.github/workflows/flutter-build.yml
    secrets: inherit
    with:
      upload-artifact: true
      upload-tag: ${{ github.ref_name }}
      publish-update-metadata: ${{ github.repository == 'rustdesk/rustdesk' }}
